<!doctype html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RoadSense{% endblock %}</title>
  <meta name="description" content="{% block description %}RoadSense is Bukidnon State University's smart campus traffic monitoring system for vehicle detection, speed monitoring, license plate recognition, horn detection, and traffic violation management.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  <meta name="theme-color" content="#1c1d26">
  <link rel="canonical" href="{% block canonical %}{{ canonical_url }}{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta property="og:site_name" content="RoadSense">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_PH">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:title" content="{% block og_title %}RoadSense | Smart Campus Traffic Monitoring System – BukSU{% endblock %}">
  <meta property="og:description" content="{% block og_description %}RoadSense is Bukidnon State University's smart campus traffic monitoring system for vehicle detection, speed monitoring, license plate recognition, horn detection, and traffic violation management.{% endblock %}">
  <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='og-image.png') }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="RoadSense Smart Campus Traffic Monitoring System for Bukidnon State University">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}RoadSense | Smart Campus Traffic Monitoring System – BukSU{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Smart campus traffic monitoring at Bukidnon State University with vehicle detection, speed monitoring, license plate recognition, and horn detection.{% endblock %}">
  <meta name="twitter:image" content="{{ site_url }}{{ url_for('static', filename='og-image.png') }}">
  {% block head_extra %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.10/dist/basecoat.cdn.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=26">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.10/dist/js/all.min.js" defer></script>
</head>
<body class="bg-background text-foreground antialiased">
<a class="skip-link" href="#main-content">Skip to main content</a>
{% block body %}{% endblock %}
</body>
</html>
