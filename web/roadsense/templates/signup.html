{% extends "public.html" %}
{% block title %}Sign up | RoadSense{% endblock %}
{% block content %}
<main class="auth-wrap">
  <div class="auth-card wide">
    <h1>Create a driver account</h1>
    <p class="muted">Use the mobile number that should receive violation alerts.</p>
    {% include "_flash.html" %}
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="grid-2">
        <div class="field"><label for="full_name">Full name</label>
          <input id="full_name" name="full_name" type="text" value="{{ form.get('full_name', '') }}" autocomplete="name" required></div>
        <div class="field"><label for="phone">Mobile number</label>
          <input id="phone" name="phone" type="tel" placeholder="09171234567" value="{{ form.get('phone', '') }}" autocomplete="tel" required></div>
      </div>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" autocomplete="username" required></div>
      <div class="grid-2">
        <div class="field"><label for="gate_pass_no">Gate pass number <span class="hint">(optional)</span></label>
          <input id="gate_pass_no" name="gate_pass_no" type="text" value="{{ form.get('gate_pass_no', '') }}"></div>
        <div class="field"><label for="plate">Plate number <span class="hint">(you can add it later)</span></label>
          <input id="plate" name="plate" type="text" placeholder="ABC 1234" value="{{ form.get('plate', '') }}"></div>
      </div>
      <div class="field"><label for="vehicle_type">Vehicle type</label>
        <select id="vehicle_type" name="vehicle_type">
          {% for v, t in (('car', 'Car'), ('motorcycle', 'Motorcycle'), ('other', 'Other')) %}
            <option value="{{ v }}" {{ 'selected' if form.get('vehicle_type') == v }}>{{ t }}</option>
          {% endfor %}
        </select></div>
      <div class="grid-2">
        <div class="field"><label for="password">Password <span class="hint">(8 or more characters)</span></label>
          <input id="password" name="password" type="password" autocomplete="new-password" required></div>
        <div class="field"><label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
      </div>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="auth-foot">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</main>
{% endblock %}
