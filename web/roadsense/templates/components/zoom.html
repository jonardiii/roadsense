{# Basecoat / shadcn/ui Fullscreen Media Zoom Modal Component #}
<style>
  .zoomable{cursor:zoom-in}
  .zoombtn{margin-top:.5rem;padding:.35rem .8rem;border:1px solid var(--line,#ccc);border-radius:6px;background:transparent;color:inherit;cursor:pointer;font:inherit}
  #zv{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:none}
  #zv.on{display:block}
  #zv .stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center}
  #zv .stage.drag{cursor:grabbing}
  #zv .item{max-width:96vw;max-height:88vh;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
  #zv .bar{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:2}
  #zv .bar button{min-width:42px;height:42px;border:0;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer}
  #zv .bar button:hover{background:rgba(255,255,255,.32)}
  #zv .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#bbb;font-size:13px;pointer-events:none}
</style>
<div id="zv" role="dialog" aria-label="Zoom view">
  <div class="bar">
    <button type="button" data-z="out" title="Zoom out">&minus;</button>
    <button type="button" data-z="reset" title="Fit to screen" style="font-size:14px">Fit</button>
    <button type="button" data-z="in" title="Zoom in">+</button>
    <button type="button" data-z="close" title="Close (Esc)">&times;</button>
  </div>
  <div class="stage"></div>
  <div class="hint">Scroll or use + / &minus; to zoom &middot; drag to move &middot; double-click to zoom in &middot; Esc to close</div>
</div>
<script>
(function () {
  var box = document.getElementById("zv"), stage = box.querySelector(".stage");
  var item = null, s = 1, x = 0, y = 0, drag = null;
  function apply() { if (item) item.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")"; }
  function zoom(f, cx, cy) {
    var n = Math.min(12, Math.max(1, s * f));
    if (cx !== undefined) {
      var r = stage.getBoundingClientRect(), px = cx - r.left - r.width / 2, py = cy - r.top - r.height / 2;
      x = px - (px - x) * (n / s); y = py - (py - y) * (n / s);
    }
    s = n; if (s === 1) { x = 0; y = 0; } apply();
  }
  function open(src, isVideo, time) {
    stage.innerHTML = "";
    item = document.createElement(isVideo ? "video" : "img");
    item.className = "item"; item.src = src; item.draggable = false;
    if (isVideo) { item.controls = true; item.autoplay = true; item.loop = true; item.muted = false;
      item.addEventListener("loadedmetadata", function () { if (time) item.currentTime = time; }); }
    stage.appendChild(item); s = 1; x = 0; y = 0; apply(); box.classList.add("on");
    document.body.style.overflow = "hidden";
  }
  function close() { box.classList.remove("on"); stage.innerHTML = ""; item = null; document.body.style.overflow = ""; }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-zoom]");
    if (t) { open(t.getAttribute("data-zoom"), false); return; }
    var b = e.target.closest("[data-zoomvideo]");
    if (b) { var v = document.getElementById(b.getAttribute("data-zoomvideo")); if (v) { v.pause(); open(v.currentSrc || v.src, true, v.currentTime); } }
  });
  box.querySelector(".bar").addEventListener("click", function (e) {
    var a = e.target.getAttribute("data-z");
    if (a === "in") zoom(1.5); else if (a === "out") zoom(1 / 1.5); else if (a === "reset") { s = 1; x = 0; y = 0; apply(); } else if (a === "close") close();
  });
  stage.addEventListener("wheel", function (e) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY); }, { passive: false });
  stage.addEventListener("dblclick", function (e) { if (s > 1) { s = 1; x = 0; y = 0; apply(); } else zoom(3, e.clientX, e.clientY); });
  stage.addEventListener("pointerdown", function (e) { if (s > 1 || e.target === stage) { drag = { x: e.clientX - x, y: e.clientY - y }; stage.classList.add("drag"); } });
  window.addEventListener("pointermove", function (e) { if (drag) { x = e.clientX - drag.x; y = e.clientY - drag.y; apply(); } });
  window.addEventListener("pointerup", function () { drag = null; stage.classList.remove("drag"); });
  stage.addEventListener("click", function (e) { if (e.target === stage) close(); });
  document.addEventListener("keydown", function (e) {
    if (!box.classList.contains("on")) return;
    if (e.key === "Escape") close(); else if (e.key === "+" || e.key === "=") zoom(1.5); else if (e.key === "-") zoom(1 / 1.5);
  });
})();
</script>
