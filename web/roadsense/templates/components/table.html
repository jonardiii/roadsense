{# Basecoat / shadcn/ui Table & Empty State Macros #}

{% macro table_wrap() -%}
  <div class="table-wrap">
    <table class="table">
      {{ caller() }}
    </table>
  </div>
{%- endmacro %}

{% macro empty_state(text, title="No records found", id="", hidden=false) -%}
  <div class="empty-state" {% if id %}id="{{ id }}"{% endif %} {% if hidden %}style="display:none"{% endif %}>
    <div class="empty-state-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/>
      </svg>
    </div>
    <strong>{{ title }}</strong>
    <p>{{ text }}</p>
  </div>
{%- endmacro %}
